
<!DOCTYPE html>
<html>
  <head>
    <title>Nametag Creator</title>
    <style>
     div.nametag {
      margin:auto;
      width: 600px;
      height:440px;
      border: solid grey 1px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 15px 15px 10px 12px rgb(167, 169, 170);
      font-family: Helvetica, Arial, sans-serif;
     }

     h1 {
      font-size:130px;
      margin:0 auto;
      background-color: #ff37d4;
      color:#ffffff;
      border-radius:inherit;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
     }
     
     h2,h3 {
      color:#ff37d4;
      font-size:60px;
      position:relative;
      margin-top:5px;
     }

     #name {
      padding-bottom:20px;
      border-bottom: 7px solid #ff37d4;
     }

     img {
      padding:70px;

     }
    </style>
  </head>
  
  <body onload="setup()">
    
    <div class="nametag">
        <h1 id="title">HELLO</h1> 
        <h2 id="subtitle">My Name Is</h2>
        <div id="name">
          <input id="get-name" type="text">
        </div>
    </div>
  
  <script src="script.js"></script>
  </body>
</html>
