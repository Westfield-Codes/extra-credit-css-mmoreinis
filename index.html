
<!DOCTYPE html>
<html>
  <head>
    <title>Nametag Creator</title>
    <style>
     div.nametag {
      width: 600px;
      height:440px;
      border: solid grey 1px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 15px 15px 10px 12px rgb(167, 169, 170);
      font-family: Helvetica, Arial, sans-serif;
     }

     h1 {
      font-size:130px;
      margin:0 auto;
      background-color: #ff37d4;
      color:#ffffff;
      border-radius:inherit;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
     }
     h2 {
      color:#ff37d4;
      font-size:60px;
      position:relative;
      margin-top:5px;
     }

     .line {
      background-color: #ff37d4;
      position: relative;
      margin-top:130px;
      height: 7px;
     }

     img {
      padding:70px;]

     }
     
    </style>
  </head>
  
  <body>
    
    <div class="nametag">
        <h1>HELLO</h1> 
        <h2>My Name Is</h2>
        <div class="line">
        </div>
    </div>
 
  
    <img src="nametag.jpg" width="800px">
  
  <script src="script.js"></script>
  </body>
</html>
